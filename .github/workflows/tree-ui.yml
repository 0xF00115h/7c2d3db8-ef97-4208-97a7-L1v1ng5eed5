name: Tree UI smoke checks

on:
  pull_request:
    paths:
      - 'assets/loader-v3.js'
      - 'assets/site.css'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/tree-ui.yml'
  push:
    branches: [main]
    paths:
      - 'assets/loader-v3.js'
      - 'assets/site.css'
      - 'index.html'
      - 'tests/**'

permissions:
  contents: read

jobs:
  tree-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tree-ui-smoke.mjs
