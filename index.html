<section id="gate"><p class="eyebrow">Living Seeds / Founding Circle</p><h1>Invitation required.</h1><p class="muted">A private garden for unfinished ideas. Enter your invitation key.</p>
<form id="unlock-form"><label for="key">Invitation key</label><input id="key" type="password" autocomplete="off" spellcheck="false" required placeholder="Paste your key"><button id="unlock" type="submit">Unlock</button></form><p id="status" role="status" aria-live="polite"></p></section>
<section id="experience" hidden><header><span class="brand">Living Seeds</span><nav id="navigation" aria-label="Site pages"></nav><button id="lock" type="button">Lock</button></header><section id="tree-panel" aria-label="Node tree" hidden></section><section id="placeholder-panel" aria-label="Node workspace instructions" hidden></section><iframe id="page" title="Private Living Seeds page" sandbox="" referrerpolicy="no-referrer"></iframe><dialog id="node-wizard" aria-labelledby="wizard-heading"><div class="wizard-head"><h2 id="wizard-heading">Grow a node</h2><button type="button" id="wizard-close" aria-label="Close">×</button></div><p id="wizard-origin"></p><fieldset><legend>How should it grow?</legend><label><input type="radio" name="growth" value="spawn" checked> Spawn — below this node</label><label><input type="radio" name="growth" value="sibling"> Sibling — beside this node</label></fieldset><label for="node-title">Node name</label><input id="node-title" maxlength="80" required placeholder="A new experiment"><label for="node-description">First idea</label><textarea id="node-description" maxlength="500" rows="4" required placeholder="What could grow here?"></textarea><p class="wizard-help">Continue to GitHub to submit the request. The new node will be prepared on a branch for review, not published immediately.</p><button type="button" id="wizard-submit">Continue on GitHub</button><p id="wizard-error" role="status"></p></dialog></section>
